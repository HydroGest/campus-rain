<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="雨否：面向广东高校校园的分钟级临近降雨查询，默认广州市海珠区，覆盖中山大学各校区及广东主要高校。" />
    <title>雨否 · 校园临近降雨</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260831" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">雨</span>
          <div class="brand-text">
            <h1>雨否</h1>
            <p>广东高校降雨自动化预报站</p>
          </div>
        </div>
        <div class="controls">
          <label class="sr-only" for="campus-select">选择校区</label>
          <select id="campus-select" aria-label="选择校区"></select>
          <button id="refresh-btn" type="button">刷新</button>
        </div>
      </div>
    </header>

    <main id="app" class="page">
      <div id="status-line" class="status-line" role="status" aria-live="polite"></div>
      <section id="nowcast" class="panel nowcast-panel" aria-label="未来2小时临近降雨"></section>
      <section id="hero" class="hero" aria-label="当前天气"></section>
      <section id="summary" class="panel" aria-label="降雨摘要"></section>
      <section id="timeline" class="panel" aria-label="未来24小时降雨时间线"></section>
      <section id="hourly" class="panel" aria-label="逐小时预报"></section>
    </main>

    <footer class="footer">
      <p id="footer-note">数据来源：彩云天气雷达临近预报与中国天气网公开数据；第三方整理，仅供校园出行参考，请以气象部门官方发布为准。</p>
      <p>空间口径：未来2小时为本校区点位（雷达回波外推）；当前实况与逐小时预报为所在区县站（数值模式 / 实况站）。</p>
      <p>联系：<a href="mailto:liubch35@mail2.sysu.edu.cn">liubch35@mail2.sysu.edu.cn</a></p>
      <p>雨否 · 请以气象部门最新预报为准。</p>
    </footer>

    <script src="locations.js?v=20260831"></script>
    <script src="config.js?v=20260831"></script>
    <script src="app.js?v=20260831"></script>
  </body>
</html>
